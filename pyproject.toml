[project]
name = "who"
version = "1.0.0"
description = "LinkedIn employee profile crawler with search by name/role and face search"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "motor>=3.3.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "playwright>=1.40.0",
    "ultralytics>=8.1.0",
    "numpy>=1.26.0",
    "pillow>=10.0.0",
]

[tool.uv]
dev-dependencies = []
